[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpsd-mqtt"
version = "0.1.0"
description = "Bridge a gpsd GPS receiver to MQTT with Home Assistant discovery."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mark Atwood" }]
keywords = ["gpsd", "gps", "mqtt", "home-assistant", "homeassistant", "nmea"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: Communications",
]
dependencies = ["paho-mqtt>=2.0"]

[project.urls]
Homepage = "https://github.com/MarkAtwood/gpsd-mqtt"
Issues = "https://github.com/MarkAtwood/gpsd-mqtt/issues"

[project.scripts]
gpsd-mqtt = "gpsd_mqtt.bridge:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["gpsd_mqtt*"]
